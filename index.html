<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Gestor de Tareas</title>

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="header">
        <h1>📋 TaskFlow</h1>
        <p>Organiza tus tareas de manera simple y eficiente</p>
    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="container">

        <!-- FORMULARIO PARA AGREGAR TAREAS -->
        <section class="task-form">

            <h2>Agregar nueva tarea</h2>

            <div class="form-group">

                <input
                    type="text"
                    id="titulo"
                    placeholder="Título de la tarea"
                >

                <textarea
                    id="descripcion"
                    placeholder="Descripción"
                ></textarea>

                <input
                    type="date"
                    id="fecha"
                >

                <button id="btnAgregar">
                    Agregar tarea
                </button>

            </div>

        </section>


        <!-- LISTA DE TAREAS -->
        <section class="tasks-section">

            <h2>Mis tareas</h2>

            <div id="listaTareas">
                <!-- Las tareas se mostrarán aquí mediante JavaScript -->
            </div>

        </section>


        <!-- TAREAS DESDE API -->
        <section class="api-section">

            <h2>Tareas desde API</h2>

            <button id="btnCargarAPI">
                Cargar tareas API
            </button>

            <div id="tareasAPI">
                <!-- Las tareas de la API aparecerán aquí -->
            </div>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer class="footer">

        <p>
            © 2026 TaskFlow | Proyecto JavaScript
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="app.js"></script>

</body>
</html>
